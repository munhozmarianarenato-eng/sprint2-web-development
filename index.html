<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sprint 2</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <h1>Sprint 2 - Web Development</h1>

    </header>

    <!-- Conteúdo principal -->
    <main class="container">

        <!-- Área de Login -->
        <section class="card login-area">

            <h2>Login</h2>

            <label for="usuario">Usuário</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button id="botaoLogin">
                Entrar
            </button>

            <p id="mensagemLogin"></p>

        </section>

        <!-- Horário Atual -->
        <section class="card horario-area">

            <h2>Horário Atual</h2>

            <p id="horario"></p>

        </section>

        <!-- Slideshow -->
        <section class="card slideshow-area">

            <h2>Slideshow</h2>

            <img
                id="imagemSlide"
                src=""
                alt="Imagem do slideshow"
                width="300"
            >

        </section>

        <!-- Lista de Tarefas -->
        <section class="card tarefas-area">

            <h2>Lista de Tarefas</h2>

            <input
                type="text"
                id="inputTarefa"
                placeholder="Digite uma tarefa"
            >

            <button id="botaoAdicionar">
                Adicionar
            </button>

            <button id="limparLista">
                Limpar Lista
            </button>

            <p class="contador">
                Quantidade de tarefas:
                <span id="contadorTarefas">0</span>
            </p>

            <ul id="listaTarefas"></ul>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>

        <p>Sprint 2 - Web Development</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
