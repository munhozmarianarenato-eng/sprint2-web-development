<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sprint 2</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h1>Sprint 2 - Web Development</h1>

    <section>

        <h2>Login</h2>

        <input
            type="text"
            id="usuario"
            placeholder="Digite seu usuário"
        >

        <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
        >

        <button id="botaoLogin">
            Entrar
        </button>

    </section>

    <section>

        <h2>Horário Atual</h2>

        <p id="horario"></p>

    </section>

    <section>

        <h2>Slideshow</h2>

        <img
            id="imagemSlide"
            src=""
            alt="Imagem"
            width="300"
        >

    </section>

    <section>

        <h2>Lista de Tarefas</h2>

        <input
            type="text"
            id="inputTarefa"
            placeholder="Digite uma tarefa"
        >

        <button id="botaoAdicionar">
            Adicionar
        </button>

        <p>
            Quantidade de tarefas:
            <span id="contadorTarefas">
                0
            </span>
        </p>

        <ul id="listaTarefas"></ul>

    </section>

    <script src="script.js"></script>

</body>
</html>
